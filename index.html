<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conta Vale | Monitor comercial dti</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700;900&family=Red+Hat+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#000053; --indigo:#2e2e70; --slate:#4d486f; --lavender:#bbc0ef; --lavender-gray:#898caf; --cream:#fafaf0; --butter:#fef4cc;
  --gold:#f9bc5d; --orange:#fe7800; --rust:#d84e0d; --rust-deep:#c34509; --brown:#69290a; --peach:#fcdaca; --white:#ffffff;
  --gray-200:#f2f2f2; --gray-300:#d9d9d9; --gray-400:#bfbfbf;
  --surface:var(--cream); --surface-raised:var(--white); --surface-warm:var(--butter); --ink:var(--navy); --ink-muted:#5a5a7a; --ink-on-warm:var(--navy);
  --accent:var(--rust); --accent-fill:var(--rust); --rule:var(--rust); --rule-soft:var(--gold); --focus-ring:var(--navy);
  --line:color-mix(in srgb, var(--navy) 12%, transparent); --field:color-mix(in srgb, var(--navy) 28%, transparent);
  --font-display:"Red Hat Display",system-ui,sans-serif; --font-text:"Red Hat Text",system-ui,sans-serif;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px; --space-16:64px;
  --radius-sm:8px; --radius-md:12px; --radius-lg:32px; --radius-pill:999px;
  --forte:var(--navy); --medio:var(--gold); --fraco:var(--rust); --none:var(--gray-400);
  --bar-comp:var(--navy); --cell-comp:var(--navy);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --surface:var(--navy); --surface-raised:var(--indigo); --ink:var(--white); --ink-muted:var(--lavender); --accent:var(--gold); --rule:var(--white); --focus-ring:var(--gold);
  --line:color-mix(in srgb, var(--white) 16%, transparent); --field:color-mix(in srgb, var(--white) 34%, transparent);
  --forte:var(--lavender); --none:var(--slate); --bar-comp:var(--lavender); --cell-comp:var(--lavender)}}
:root[data-theme="dark"]{
  --surface:var(--navy); --surface-raised:var(--indigo); --ink:var(--white); --ink-muted:var(--lavender); --accent:var(--gold); --rule:var(--white); --focus-ring:var(--gold);
  --line:color-mix(in srgb, var(--white) 16%, transparent); --field:color-mix(in srgb, var(--white) 34%, transparent);
  --forte:var(--lavender); --none:var(--slate); --bar-comp:var(--lavender); --cell-comp:var(--lavender)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-text);font-size:16px;line-height:1.55}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink);text-decoration-color:var(--accent);text-underline-offset:3px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);color:var(--ink);margin:0;text-wrap:pretty}

/* header: chão navy */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:var(--white);border-bottom:1px solid color-mix(in srgb, var(--white) 14%, transparent)}
.top-in{max-width:1240px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;min-height:72px}
.brand{display:flex;align-items:center;gap:16px;padding:14px 0}
.vale-logo{height:32px;width:auto;display:block}
.brand span{border-left:1px solid color-mix(in srgb, var(--white) 30%, transparent);padding-left:16px;font-family:var(--font-display);font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--lavender)}
nav{display:flex;gap:28px;margin-left:auto;align-self:stretch}
nav a{color:var(--lavender);text-decoration:none;font-family:var(--font-display);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;border-bottom:2px solid transparent;padding-top:2px}
nav a:hover{color:var(--white)}
@media (max-width:760px){nav{width:100%;margin-left:0;overflow-x:auto;gap:20px;min-height:44px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav a{white-space:nowrap;flex:none}}
nav a[aria-current="page"]{color:var(--white);border-bottom-color:var(--gold)}
.exp{border:1px solid var(--gold);background:transparent;color:var(--gold);font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:0 18px;min-height:38px;border-radius:var(--radius-pill);cursor:pointer;transition:background-color .2s,color .2s}
.exp:hover{background:var(--gold);color:var(--navy)}
.exp:disabled{opacity:.45;cursor:wait}

.exp-solid{background:var(--gold);color:var(--navy)}
.exp-solid:hover{background:var(--butter);border-color:var(--butter)}
dialog{border:0;border-radius:var(--radius-md);padding:var(--space-8);max-width:440px;width:calc(100% - 32px);background:var(--surface-raised);color:var(--ink)}
dialog::backdrop{background:color-mix(in srgb, var(--navy) 60%, transparent)}
dialog h2{margin-bottom:var(--space-3)}
dialog input{margin-bottom:var(--space-3)}
.dlg-actions{display:flex;justify-content:flex-end;align-items:center;gap:var(--space-2);margin-top:var(--space-4);flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--field)}
.btn.ghost:hover{background:transparent;border-color:var(--ink)}
.ro-banner a{color:var(--ink-on-warm);font-weight:700;cursor:pointer}
main{max-width:1240px;margin:0 auto;padding:var(--space-12) 24px 80px}
.eyebrow{display:block;font-family:var(--font-display);font-weight:500;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:var(--space-3)}
h1{font-size:clamp(30px,4vw,40px);line-height:1.1;font-weight:400;text-transform:uppercase;margin-bottom:var(--space-3)}
h1 b,h2 b{font-weight:700}
h2{font-size:clamp(24px,2.6vw,30px);line-height:1.15;font-weight:400;text-transform:uppercase}
h3{font-size:18px;line-height:1.25;font-weight:700;margin-bottom:var(--space-4)}
.lede{color:var(--ink);margin:0 0 var(--space-8);max-width:62ch;font-size:19px;line-height:1.5}
section{margin-top:72px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:var(--space-6);flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:var(--space-4)}
.sec-head .eyebrow{font-size:14px}
.sec-head p{margin:6px 0 0;color:var(--ink-muted);font-size:15px}
.panel{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-6)}
.muted{color:var(--ink-muted)}
.small{font-size:14px}

/* battle card dti strip */
.bc-strip{display:grid;grid-template-columns:1.25fr repeat(3,1fr);background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;text-decoration:none!important;color:inherit!important}
.bc-strip > div{padding:var(--space-6);border-left:1px solid var(--line)}
.bc-strip > div:first-child{border-left:0;background:var(--navy);color:var(--white)}
.bc-strip .k{font-family:var(--font-text);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:var(--space-3)}
.bc-strip > div:first-child .k{color:var(--lavender)}
.frac{font-family:var(--font-display);font-size:64px;font-weight:700;line-height:.95;color:var(--gold)}
.frac small{font-size:24px;font-weight:400;color:var(--white)}
.bc-strip .v{font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:18px}
.bc-strip:hover > div:first-child{background:var(--indigo)}
@media (max-width:900px){.bc-strip{grid-template-columns:1fr 1fr}.bc-strip > div{border-left:0;border-top:1px solid var(--line)}.bc-strip > div:first-child{grid-column:1/-1;border-top:0}}

/* organograma vertical */
.org{display:flex;flex-direction:column;align-items:center}
.org-v{width:1px;height:32px;background:var(--rule)}
.exec{display:flex;align-items:center;gap:var(--space-4);background:var(--navy);color:var(--white);border-radius:var(--radius-pill);padding:10px 28px 10px 10px;min-width:300px}
.exec .role{font-family:var(--font-text);font-size:12px;letter-spacing:.12em;color:var(--gold);font-weight:700;text-transform:uppercase}
.exec .nm{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.2}
.exec .li{color:var(--lavender)}
.exec .li.empty{color:color-mix(in srgb, var(--white) 55%, transparent)}
.exec .ava{background:var(--indigo);color:var(--white);border-color:var(--lavender)}
.umbrella{align-self:stretch;position:relative;border:1px solid var(--rule);border-bottom:0;border-radius:var(--radius-md) var(--radius-md) 0 0;padding:var(--space-12) var(--space-6) 0}
.umb-label{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);background:var(--surface);padding:0 var(--space-3);font-family:var(--font-text);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
@media (max-width:640px){.umbrella{padding:var(--space-8) var(--space-3) 0;border-radius:var(--radius-sm) var(--radius-sm) 0 0}.exec{min-width:0;width:100%}}

/* avatar: círculo */
.ava{--s:56px;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--butter);color:var(--navy);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:calc(var(--s)*.32);overflow:hidden;position:relative;border:1px dashed var(--field)}
.ava.has{border:0}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.lg{--s:128px}
.li{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);padding:2px 0}
.li svg{width:14px;height:14px}
.li:hover{color:var(--accent)}
.li.empty{color:var(--ink-muted);font-weight:400}

/* cards de diretoria */
.dirs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:var(--space-4)}
.dcard{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-6);text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:var(--space-4);position:relative;transition:border-color .2s}
.dcard:hover{border-color:var(--accent);color:inherit}
.role-tag{position:absolute;top:var(--space-4);right:var(--space-4);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink-muted)}
.dcard .who{display:flex;gap:var(--space-4);align-items:center;padding-right:28px}
.dcard .nm{font-family:var(--font-display);font-weight:700;color:var(--ink);line-height:1.2;font-size:17px}
.dcard .area{font-size:13px;color:var(--ink-muted);line-height:1.35;margin-top:2px}
.share{display:flex;align-items:center;gap:var(--space-3);font-size:13px}
.share .bar{flex:1;height:8px;background:var(--gray-200);border-radius:var(--radius-pill);overflow:hidden}
:root[data-theme="dark"] .share .bar{background:var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .share .bar{background:var(--line)}}
.share .bar i{display:block;height:100%;background:var(--accent-fill);border-radius:var(--radius-pill)}
.share b{font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:20px}
.farols{display:flex;gap:var(--space-4);font-size:13px;color:var(--ink-muted);flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--none);vertical-align:-1px;margin-right:6px}
.dot.forte{background:var(--forte)}.dot.medio{background:var(--medio)}.dot.fraco{background:var(--fraco)}
.meet{font-size:13px;color:var(--ink-muted);border-top:1px solid var(--rule-soft);padding-top:var(--space-3)}
.meet b{color:var(--ink);font-weight:700}

/* matriz */
.mx-wrap{overflow-x:auto;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-md)}
table.mx{border-collapse:separate;border-spacing:0;width:100%;min-width:1100px;font-size:13px}
.mx th,.mx td{padding:10px 6px;border-bottom:1px solid var(--rule-soft);text-align:center}
.mx thead th{vertical-align:bottom;background:var(--surface-raised);padding-top:20px;border-bottom:1px solid var(--rule)}
.mx th.rowh{text-align:left;padding-left:20px;position:sticky;left:0;background:var(--surface-raised);z-index:1;min-width:240px}
.mx thead th.rowh{font-family:var(--font-text);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.mx tbody tr:hover th.rowh,.mx tbody tr:hover td{background:color-mix(in srgb, var(--butter) 55%, var(--surface-raised))}
:root[data-theme="dark"] .mx tbody tr:hover th.rowh,:root[data-theme="dark"] .mx tbody tr:hover td{background:var(--slate)}
.mx tbody th.rowh a{color:var(--ink);text-decoration:none;font-family:var(--font-display);font-weight:700;display:block;line-height:1.25;font-size:14px}
.mx tbody th.rowh a:hover{color:var(--accent)}
.mx tbody th.rowh span{display:block;font-family:var(--font-text);font-weight:400;color:var(--ink-muted);font-size:12px}
.mx .col-dti{background:var(--butter)!important;color:var(--ink-on-warm)}
.mx thead .col-dti{color:var(--rust-deep);font-family:var(--font-display);font-weight:700;font-size:18px}
.mx .col-dti .muted{color:var(--ink-on-warm);opacity:.6}
.mx .tot{color:var(--ink-muted);font-weight:700}
.cell{display:inline-grid;place-items:center;border-radius:50%;background:var(--cell-comp);color:var(--surface-raised);font-family:var(--font-display);font-weight:700}
.cell.dti{background:var(--accent-fill);color:var(--white)}
.mx tfoot td,.mx tfoot th{font-family:var(--font-display);font-weight:700;color:var(--ink);border-bottom:0;background:var(--surface)}
.mx tfoot th.rowh{background:var(--surface);font-family:var(--font-text);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.chead{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:76px}

/* logos */
.logo{--h:34px;height:var(--h);min-width:calc(var(--h)*1.9);max-width:calc(var(--h)*3);border-radius:var(--radius-sm);border:1px dashed var(--field);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--ink-muted);background:var(--surface);padding:0 6px;overflow:hidden;line-height:1.1;text-align:center}
.logo.has{border:1px solid var(--gray-300);background:var(--white);padding:3px 6px}
.logo img{max-height:calc(var(--h) - 8px);width:auto;object-fit:contain}
.logo.lg{--h:56px}
button.logo{cursor:pointer}
button.logo:hover{border-color:var(--accent);color:var(--accent)}

/* ações */
.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.acts li{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--rule-soft)}
.acts li:last-child{border-bottom:0}
.acts li.done .t{text-decoration:line-through;color:var(--ink-muted)}
.acts .t{flex:1}
.acts .src{font-size:12px;display:block;margin-top:2px;color:var(--accent);text-decoration:none;font-weight:700}
.acts input[type=checkbox]{margin-top:4px;accent-color:var(--rust);width:16px;height:16px}
.iconbtn{border:0;background:transparent;cursor:pointer;color:var(--ink-muted);padding:2px 8px;border-radius:var(--radius-pill);font-size:18px;line-height:1}
.iconbtn:hover{color:var(--accent)}
.addrow{display:flex;gap:var(--space-2);margin-top:var(--space-4)}
.addrow input{flex:1}
input[type=text],input[type=url],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--field);border-radius:var(--radius-sm);padding:11px 14px;width:100%;min-width:0;color:var(--ink)}
input:hover,textarea:hover{border-color:var(--ink)}
input:disabled,textarea:disabled{background:var(--surface);opacity:.75;cursor:not-allowed}
textarea{min-height:130px;resize:vertical;line-height:1.55}
.btn{border:0;background:var(--accent-fill);color:var(--white);border-radius:var(--radius-pill);padding:0 22px;min-height:44px;font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--rust-deep)}
label.f{display:block;font-family:var(--font-text);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:var(--space-2)}

/* battle card */
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:var(--space-6);flex-wrap:wrap;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.crumbs a{text-decoration:none;color:var(--accent)}
.crumbs a:hover{color:var(--ink)}
.bc-head{display:flex;gap:var(--space-8);align-items:center;flex-wrap:wrap;margin-bottom:var(--space-8);padding-bottom:var(--space-8);border-bottom:1px solid var(--rule)}
.bc-head .area{font-family:var(--font-display);font-weight:500;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:var(--space-3)}
.bc-head .lirow{display:flex;gap:10px;align-items:center;margin-top:var(--space-4);max-width:460px}
.grid{display:grid;gap:var(--space-4)}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:860px){.g2,.g3{grid-template-columns:1fr}}
.stat{display:flex;gap:var(--space-8);flex-wrap:wrap}
.stat div b{display:block;font-family:var(--font-display);font-size:36px;font-weight:700;color:var(--ink);line-height:1.05}
.stat div span{font-size:13px;color:var(--ink-muted)}
.stat div.dti b{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-4)}
.chip{background:var(--accent-fill);color:var(--white);font-family:var(--font-text);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:var(--radius-pill)}
.chip.q{background:transparent;color:var(--ink);border:1px solid var(--gold)}
.bars{display:flex;flex-direction:column;gap:var(--space-3)}
.brow{display:grid;grid-template-columns:auto 1fr 40px;gap:var(--space-4);align-items:center}
.brow .track{height:12px;background:var(--gray-200);border-radius:var(--radius-pill);overflow:hidden}
:root[data-theme="dark"] .brow .track{background:var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brow .track{background:var(--line)}}
.brow .track i{display:block;height:100%;background:var(--bar-comp);border-radius:var(--radius-pill)}
.brow b{text-align:right;font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:18px}
.brow .logo{--h:32px;width:108px;max-width:108px}
.brow.is-dti{background:var(--butter);margin:0 calc(var(--space-3)*-1);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm)}
.brow.is-dti .track{background:color-mix(in srgb, var(--navy) 8%, var(--butter))}
.brow.is-dti .track i{background:var(--accent-fill)}
.brow.is-dti b{color:var(--rust-deep)}
.brow.is-dti .logo{border-color:transparent}
.others{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.others span{display:inline-flex;align-items:center;gap:8px;background:var(--white);color:var(--navy);border:1px solid var(--gold);border-radius:var(--radius-pill);padding:5px 14px;font-size:13px}
.others span b{color:var(--navy);font-family:var(--font-display)}
.slogo{height:22px;width:auto;max-width:110px;object-fit:contain;display:block}
.note{background:var(--butter);color:var(--ink-on-warm);padding:var(--space-3) var(--space-4);font-size:15px;margin-top:var(--space-4);border-radius:var(--radius-md)}
.farol-pick{display:flex;gap:var(--space-2);flex-wrap:wrap}
.farol-pick button{border:1px solid var(--field);background:var(--surface);border-radius:var(--radius-pill);padding:8px 16px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;color:var(--ink)}
.farol-pick button:hover:not(:disabled){border-color:var(--ink)}
.farol-pick button[aria-pressed="true"]{background:var(--navy);color:var(--white);border-color:var(--navy);font-weight:700}
:root[data-theme="dark"] .farol-pick button[aria-pressed="true"]{background:var(--gold);color:var(--navy);border-color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .farol-pick button[aria-pressed="true"]{background:var(--gold);color:var(--navy);border-color:var(--gold)}}
.farol-pick button:disabled{cursor:not-allowed}
.farol-pick button:disabled:not([aria-pressed="true"]){opacity:.45}

/* equipe */
.ava.sm{--s:40px}
.hcount{font-family:var(--font-text);font-weight:400;font-size:14px;color:var(--ink-muted);margin-left:8px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--space-4);align-items:start}
.tgroup{border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-2);background:var(--surface)}
.tgroup.flat{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2px;border:0;padding:0;background:transparent}
.trow{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2);border-radius:var(--radius-sm);text-decoration:none;color:var(--ink)}
.trow:hover{background:color-mix(in srgb, var(--butter) 70%, transparent);color:var(--ink)}
:root[data-theme="dark"] .trow:hover{background:var(--slate)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .trow:hover{background:var(--slate)}}
.tinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.tnm{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.25}
.tarea{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);line-height:1.3;margin-top:2px}
.tfarol .dot{margin:0}
.trow.l1{padding-bottom:var(--space-3)}
.tkids{border-top:1px solid var(--rule-soft);margin:0 var(--space-2);padding:var(--space-2) 0 0 var(--space-4);border-left:1px solid var(--rule-soft)}
.trow.l2 .tnm{font-size:14px;font-weight:500}
.cfields{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-4)}
.collapsible summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);cursor:pointer}
.collapsible summary::-webkit-details-marker{display:none}
.collapsible summary h3{margin:0}
.collapsible[open] summary{margin-bottom:var(--space-4)}
.tog{display:inline-flex;align-items:center;gap:var(--space-3);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.tog-txt::after{content:"Mostrar"}
.collapsible[open] .tog-txt::after{content:"Recolher"}
.chev{width:32px;height:32px;border-radius:50%;border:1px solid var(--field);display:grid;place-items:center;flex:none;transition:border-color .2s}
.chev::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.collapsible[open] .chev::before{transform:translateY(2px) rotate(-135deg)}
.collapsible summary:hover .chev{border-color:var(--accent)}

/* estratégia vale */
.e-statement{background:var(--navy);color:var(--white);border-radius:var(--radius-md);padding:var(--space-12) var(--space-8);margin-top:var(--space-6)}
.e-big{font-family:var(--font-display);font-weight:400;font-size:clamp(22px,2.8vw,32px);line-height:1.3;margin:0 0 var(--space-6);max-width:40ch}
.e-big b{color:var(--gold);font-weight:700}
.e-sub{margin:0;font-size:18px;line-height:1.55;color:var(--lavender);max-width:62ch}
.e-sub b{color:var(--white)}
.flow{display:flex;flex-direction:column;align-items:center;padding:var(--space-4) 0}
.fl-node{background:var(--navy);color:var(--white);font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:12px 26px;border-radius:var(--radius-pill);text-align:center}
:root[data-theme="dark"] .fl-node:not(.accent):not(.gold){background:var(--indigo)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fl-node:not(.accent):not(.gold){background:var(--indigo)}}
.fl-node.accent{background:var(--rust)}
.fl-node.gold{background:var(--gold);color:var(--navy)}
.fl-stem{width:1px;height:28px;background:var(--rule);flex:none}
.fl-mini{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1px solid var(--rule);border-radius:var(--radius-pill);padding:4px 12px;background:var(--surface-raised)}
.fl-row{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;max-width:880px;padding:28px 0}
.fl-row::before,.fl-row::after{content:"";position:absolute;left:calc((100% - 32px)/6);right:calc((100% - 32px)/6);border-top:1px solid var(--rule)}
.fl-row::before{top:0}.fl-row::after{bottom:0}
.fl-col{position:relative;display:flex}
.fl-col::before,.fl-col::after{content:"";position:absolute;left:50%;height:28px;border-left:1px solid var(--rule)}
.fl-col::before{top:-28px}.fl-col::after{bottom:-28px}
.fl-card{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-4);text-align:center}
.fl-card b{display:block;font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:16px}
.fl-card.slim{padding:10px var(--space-3)}
.fl-card ul{list-style:none;margin:var(--space-2) 0 0;padding:var(--space-2) 0 0;border-top:1px solid var(--rule-soft);font-size:14px;color:var(--ink-muted);line-height:1.6}
.fl-plus{display:flex;gap:var(--space-2);flex-wrap:wrap;justify-content:center}
.fl-plus span{border:1px solid var(--gold);border-radius:var(--radius-pill);padding:6px 16px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
@media (max-width:640px){.fl-row{gap:8px}.fl-row::before,.fl-row::after{left:calc((100% - 16px)/6);right:calc((100% - 16px)/6)}.fl-card{padding:var(--space-2)}.fl-card b{font-size:13px}.fl-card ul{font-size:12px}.fl-node{font-size:11px;padding:10px 16px}.e-statement{padding:var(--space-8) var(--space-6)}}
.e-obj{display:flex;flex-direction:column;gap:var(--space-3)}
.e-obj-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,1.4fr) minmax(0,1.8fr);gap:var(--space-6);background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-6);align-items:start}
.e-obj-name{overflow-wrap:anywhere;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--ink);line-height:1.25;border-left:3px solid var(--rust);padding-left:var(--space-3)}
.e-obj-row p{margin:0;font-size:15px}
.e-lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px}
@media (max-width:900px){.e-obj-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.e-obj-name{grid-column:1/-1}}
@media (max-width:560px){.e-obj-row{grid-template-columns:1fr}}
.etags{display:flex;flex-wrap:wrap;gap:6px}
.etag{border:1px solid var(--gold);border-radius:var(--radius-pill);padding:3px 10px;font-size:13px;color:var(--ink);background:var(--surface)}
.etag.solid{background:var(--butter);border-color:var(--butter);color:var(--navy)}
.e-pil{min-width:980px}
.e-pil td{vertical-align:top;padding-top:14px;padding-bottom:14px}
.e-num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--white);font-family:var(--font-display);font-weight:700;font-size:12px;margin-right:10px;vertical-align:middle}
:root[data-theme="dark"] .e-num{background:var(--gold);color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .e-num{background:var(--gold);color:var(--navy)}}
.e-pcell{display:flex;align-items:center;gap:10px}
.e-pcell .e-num{margin-right:0;flex:none}
.e-pname{font-family:var(--font-display);color:var(--ink);vertical-align:middle}
.e-hz{display:flex;gap:3px;width:110px;margin-top:4px}
.e-hz i{flex:1;height:8px;border-radius:var(--radius-pill);background:var(--gray-200)}
:root[data-theme="dark"] .e-hz i{background:var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .e-hz i{background:var(--line)}}
.e-hz i.on{background:var(--rust)}
.e-hzl{display:block;font-size:12px;color:var(--ink-muted);margin-top:4px;font-weight:700}
.e-kpi{font-weight:700;color:var(--ink)}
.e-foco{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4)}
.e-foco-card{background:var(--navy);color:var(--white);border-radius:var(--radius-md);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}
:root[data-theme="dark"] .e-foco-card{background:var(--indigo)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .e-foco-card{background:var(--indigo)}}
@media (max-width:900px){.e-foco{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.e-foco{grid-template-columns:1fr}}
.e-foco-card b{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.2}
.e-dots{display:flex;gap:6px}
.e-dots i{width:14px;height:14px;border-radius:50%;border:1px solid var(--gold)}
.e-dots i.on{background:var(--gold)}
.e-pot{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:var(--radius-pill);border:1px solid var(--lavender);color:var(--lavender)}
.e-pot.max{background:var(--rust);border-color:var(--rust);color:var(--white)}

.comps{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:var(--space-4)}

.ccard .nm{font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:19px}

.ccard li{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--rule-soft)}
.ccard li a{text-decoration:none;color:var(--ink)}
.ccard li a:hover{color:var(--accent)}
.ccard li b{font-family:var(--font-display);color:var(--ink)}

table.plain{width:100%;border-collapse:collapse;font-size:14px}
.plain th,.plain td{text-align:left;padding:10px;border-bottom:1px solid var(--rule-soft)}
.plain th{font-family:var(--font-text);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);border-bottom-color:var(--rule)}
.plain td.n{text-align:right;font-family:var(--font-display);font-weight:700;color:var(--ink)}
.plain a{text-decoration:none;font-weight:700}
.tbl-wrap{overflow-x:auto}

/* rodapé: logo no canto inferior direito */
.foot{border-top:1px solid var(--rule)}
.foot-in{max-width:1240px;margin:0 auto;padding:var(--space-6) 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.foot img{height:28px;width:auto;display:block}
.foot span{color:var(--ink-muted);font-size:13px}
.lg-white{display:none!important}
:root[data-theme="dark"] .lg-navy{display:none!important}
:root[data-theme="dark"] .lg-white{display:block!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-navy{display:none!important}:root:not([data-theme="light"]) .lg-white{display:block!important}}
.status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--white);padding:12px 22px;border-radius:var(--radius-pill);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;border:1px solid var(--gold)}
.status.show{opacity:1}
.ro-banner{background:var(--butter);color:var(--ink-on-warm);border-radius:var(--radius-md);padding:10px 16px;font-size:14px;margin-bottom:var(--space-6)}
.empty{color:var(--ink-muted);font-size:14px;padding:6px 0;margin:0}
@media (max-width:768px){h1{font-size:28px}.frac{font-size:48px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

const COLL = {people:"people",dirs:"dirs",dti:"account",mgrs:"mgrs"};

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials = n => n.split(/\s+/).filter(Boolean).filter((w,i,a)=>i===0||i===a.length-1).map(w=>w[0]).join("").toUpperCase();
const fmtDate = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; };
const pct = (a,b) => b? (a/b*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%" : "0%";
function toast(msg){const el=document.getElementById("status");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2200)}

const queues = {};
function save(coll,id,patch){
  if(!sb||!canWrite){toast("Entre com um e-mail de editor para salvar alterações");return}
  const target = coll==="dti" ? S.dti : (S[coll][id]=S[coll][id]||{});
  Object.assign(target,patch);
  let data = {...target}; if(coll==="people") delete data.photo;
  const path = COLL[coll]+"/"+id;
  queues[path]=(queues[path]||Promise.resolve())
    .then(async()=>{const {error}=await sb.from("docs").upsert({collection:COLL[coll],id,data});if(error)throw error})
    .then(()=>toast("Salvo"))
    .catch(e=>{
      if(e&&(e.code==="42501"||/row-level security/i.test(e.message||""))){canWrite=false;toast("Seu e-mail não tem permissão de edição");render()}
      else toast("Não foi possível salvar. Tente de novo.");
    });
}

function avatar(id,name,size){
  const p=S.people[id]||{}; const src=p.photo||`img/fotos/${id}.jpg`; const cls="ava has"+(size?" "+size:"");
  const ini=esc(initials(name));
  const inner = `<img src="${esc(src)}" alt="Foto de ${esc(name)}" onerror="this.parentNode.classList.remove('has');this.parentNode.textContent='${ini}'">`;
  return `<span class="${cls}">${inner}</span>`;
}
function liLink(id){
  const u=(S.people[id]||{}).linkedin;
  return u? `<a class="li" href="${esc(u)}" target="_blank" rel="noopener">${LI_ICON}LinkedIn</a>` : `<span class="li empty">${LI_ICON}LinkedIn a incluir</span>`;
}
function logo(cid,size){
  const c=COMPS.find(x=>x.id===cid); const l=(S.comps[cid]||{}).logo;
  const cls="logo"+(size?" "+size:"")+(l?" has":"");
  const inner = l? `<img src="${esc(l)}" alt="${esc(c.name)}">` : esc(c.name);
  return `<span class="${cls}" title="${esc(c.name)}">${inner}</span>`;
}
function supLogo(x){const k=x[2]||x[3];const l=k&&(S.comps[k]||{}).logo;return l?`<img class="slogo" src="${esc(l)}" alt="${esc(x[0])}" title="${esc(x[0])}">`:""}
function farolOf(id,key){return (S.dirs[id]||{})[key]||"none"}
function dot(v){return `<span class="dot ${v}"></span>`}

        <div><span class="e-lbl">Principais projetos e soluções</span>${tags(p)}</div>
      </div>`).join("")}</div>
  </section>

  <section>
    <div class="sec-head"><div><span class="eyebrow">03 Pilares</span><h2>Pilares <b>tecnológicos</b></h2><p>Onze frentes com objetivo, projetos-chave, horizonte e KPI principal.</p></div></div>
    <div class="mx-wrap"><table class="plain e-pil">
      <thead><tr><th>Pilar tecnológico</th><th>Objetivo de negócio</th><th>Projetos-chave</th><th>Horizonte</th><th>KPI principal</th></tr></thead>
      <tbody>${ESTR.pilares.map(([n,o,p,end,k],i)=>`<tr>
        <td><div class="e-pcell"><span class="e-num">${i+1}</span><b class="e-pname">${esc(n)}</b></div></td>
        <td>${esc(o)}</td>
        <td>${tags(p)}</td>
        <td><div class="e-hz" title="2026–${end}">${years.map(y=>`<i class="${y<=end?"on":""}"></i>`).join("")}</div><span class="e-hzl">2026–${String(end).slice(2)}</span></td>
        <td class="e-kpi">${esc(k)}</td></tr>`).join("")}</tbody>
    </table></div>
  </section>

  <section>
    <div class="sec-head"><div><span class="eyebrow">04 Foco dti</span><h2>Territórios de <b>atuação</b></h2><p>Atratividade e potencial de cada território para a dti.</p></div></div>
    <div class="e-foco">${ESTR.foco.map(([t,s,p])=>`
      <div class="e-foco-card">
        <b>${esc(t)}</b>
        <div class="e-dots" aria-label="Atratividade ${s} de 5">${[1,2,3,4,5].map(n=>`<i class="${n<=s?"on":""}"></i>`).join("")}</div>
        <span class="e-pot ${p==="Muito alto"?"max":""}">Potencial ${esc(p.toLowerCase())}</span>
      </div>`).join("")}</div>
  </section>`;
}

/* ---------- Router ---------- */
let pending=false;
function isEditing(){const a=document.activeElement;return a&&$view.contains(a)&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.type!=="checkbox"}
function render(){
  if(isEditing()){pending=true;return}
  pending=false;
  const h=(location.hash||"#geral").slice(1);
  let html, nav="geral";
  if(h.startsWith("diretoria/")){html=viewDir(h.split("/")[1]);nav="geral"}
  else if(h.startsWith("gestor/")){html=viewMgr(h.split("/")[1]);nav="geral"}
  else if(h==="dti"){html=viewDti();nav="dti"}
  else if(h==="estrategia"){html=viewEstrategia();nav="estrategia"}
  else if(h==="concorrentes"){html=viewConc();nav="concorrentes"}
  else html=viewGeral();
  const ro = !dbChecked ? "" : !sb ? '<div class="ro-banner">Sem conexão com o banco de dados. Confira o arquivo config.js.</div>'
    : !userEmail ? '<div class="ro-banner">Modo visualização. <a data-login href="#">Entre</a> para editar.</div>'
    : !canWrite ? `<div class="ro-banner">Conectado como ${esc(userEmail)}, sem permissão de edição. Peça a inclusão do seu e-mail na lista de editores.</div>` : "";
  $view.innerHTML=ro+html;
  document.querySelectorAll("#nav a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+nav?"page":"false"));
}
let lastHash=location.hash;
window.addEventListener("hashchange",()=>{pending=false;document.activeElement&&document.activeElement.blur();render();if(location.hash!==lastHash)window.scrollTo(0,0);lastHash=location.hash});
document.addEventListener("focusout",()=>setTimeout(()=>{if(pending&&!isEditing())render()},0));

/* ---------- Interações ---------- */
document.addEventListener("click",e=>{
  if(e.target.closest("[data-login]")){e.preventDefault();openLogin("login");return}
  const f=e.target.closest("[data-farol]");
  if(f&&canWrite){const {farol,id,key,val}=f.dataset;
    if(farol==="dti") save("dti","dti",{[key]:val}); else save(f.dataset.coll||"dirs",id,{[key]:val});
    render();return}
  const add=e.target.closest("[data-act-add]");
  if(add){const inp=document.getElementById("newact");const txt=inp.value.trim();if(!txt){inp.focus();return}
    const id=add.dataset.actAdd,c=add.dataset.coll||"dirs";const list=[...((S[c][id]||{}).acoes||[]),{id:Date.now().toString(36),text:txt,done:false}];
    inp.value="";inp.blur();save(c,id,{acoes:list});render();return}
  const del=e.target.closest("[data-act-del]");
  if(del){const id=del.dataset.dir,c=del.dataset.coll||"dirs";const list=((S[c][id]||{}).acoes||[]).filter(a=>a.id!==del.dataset.actDel);save(c,id,{acoes:list});render();return}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="newact"){e.preventDefault();document.querySelector("[data-act-add]").click()}});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.actToggle){const id=el.dataset.dir,c=el.dataset.coll||"dirs";const list=((S[c][id]||{}).acoes||[]).map(a=>a.id===el.dataset.actToggle?{...a,done:el.checked}:a);save(c,id,{acoes:list});render();return}
  if(el.dataset.dir&&el.dataset.key){const c=el.dataset.coll||"dirs";if(String((S[c][el.dataset.dir]||{})[el.dataset.key]||"")!==el.value){save(c,el.dataset.dir,{[el.dataset.key]:el.value});if(c==="mgrs"&&/^contratos/.test(el.dataset.key))render()}return}
  if(el.dataset.dti){if((S.dti[el.dataset.dti]||"")!==el.value) save("dti","dti",{[el.dataset.dti]:el.value});return}
  if(el.dataset.li){let v=el.value.trim();if(v&&!/^https?:\/\//i.test(v))v="https://"+v;
    if(v&&!/linkedin\.com\//i.test(v)){toast("Use um link do linkedin.com");return}
    save("people",el.dataset.li,{linkedin:v});render();return}
});

/* ---------- Exportar planilha ---------- */
function buildWorkbook(){
  const XL=window.XLSX; const wb=XL.utils.book_new();
  const F=v=>FAROL[v||"none"];
  const add=(name,rows,widths)=>{const ws=XL.utils.aoa_to_sheet(rows);ws["!cols"]=widths.map(w=>({wch:w}));XL.utils.book_append_sheet(wb,ws,name)};
  const t=S.dti;
  add("Battle card dti",[
    ["Conta Vale | Battle card dti",""],
    ["Exportado em",new Date().toLocaleString("pt-BR")],[],
    ["Indicador","Valor"],
    ["Contratos dti",TOTAL_DTI],["Total de contratos",TOTAL],["Participação dti",TOTAL?TOTAL_DTI/TOTAL:0],
    ["Contratos de serviço",TOTAL_SERV],["Diretorias com dti",`${DIRS.filter(d=>d.dti>0).length} de ${DIRS.length}`],
    ["Relacionamento",F(t.relacionamento)],["Contexto do relacionamento",t.relNota||""],
    ["Cadência de reunião executiva",t.cadencia||""]
  ],[32,60]);
  add("Executivos",[["Nome","Cargo","Diretoria","Reporta a","LinkedIn"],
    ...EXECS.map((e,i)=>[e.name,e.role,"",i?EXECS[0].name:"",(S.people[e.id]||{}).linkedin||""]),
    ...DIRS.map(d=>[d.name,"VP-2",d.area,EXECS[1].name,(S.people[d.id]||{}).linkedin||""])],[34,14,52,22,60]);
  add("Diretorias",[["Diretor","Diretoria","Contratos totais","Contratos de serviço","Contratos dti","Participação dti","Contratos dti (nomes)","Relacionamento com o diretor","Última reunião","Próxima reunião","Observação","Melhorias para a frente"],
    ...DIRS.map(d=>{const s=S.dirs[d.id]||{};return [d.name,d.area,d.total,d.service,d.dti,d.total?d.dti/d.total:0,d.dtiContracts.map(c=>c.n+(c.q?" (a confirmar)":"")).join(", "),F(s.farolDir),fmtDate(s.ultReuniao),fmtDate(s.proxReuniao),d.note||"",s.melhorias||""]})],
    [34,52,15,18,13,15,26,14,14,14,15,30,60]);
  add("Mapa de presença",[["Diretor","Diretoria","dti",...COMPS.map(c=>c.name),"Total da área"],
    ...DIRS.map(d=>[d.name,d.area,d.dti,...COMPS.map(c=>compCount(d,c.id)||""),d.total]),
    ["Total","",TOTAL_DTI,...COMPS.map(c=>COMP_STATS.find(x=>x.id===c.id).total),TOTAL]],
    [34,52,6,...COMPS.map(()=>12),14]);
  const fr=[["Diretor","Diretoria","Fornecedor","Contratos","Concorrente mapeado"]];
  DIRS.forEach(d=>[...d.sup].sort((a,b)=>b[1]-a[1]).forEach(x=>fr.push([d.name,d.area,x[0],x[1],x[2]?"Sim":"Não"])));
  add("Fornecedores",fr,[34,52,24,11,20]);
  add("Concorrentes",[["Concorrente","Contratos na conta","Nº de diretorias","Diretorias (contratos)"],
    ...COMP_STATS.map(c=>[c.name,c.total,c.per.length,c.per.map(x=>`${x.d.name} (${x.n})`).join("; ")])],[22,18,16,110]);
  add("Gestores",[["VP-2","Reporta a","Nome","Cargo","Área","LinkedIn","Relacionamento","Última reunião","Próxima reunião","Contratos totais","Contratos dti","Contratos dti (nomes)","Melhorias para a frente"],
    ...MGRS.map(m=>{const s=S.mgrs[m.id]||{};return [DIRS.find(x=>x.id===m.dir).name,parentName(m),m.name,m.role,m.area,(S.people[m.id]||{}).linkedin||"",F(s.farol),fmtDate(s.ultReuniao),fmtDate(s.proxReuniao),s.contratosTotal?+s.contratosTotal:"",s.contratosDti?+s.contratosDti:"",s.contratosDtiNomes||"",s.melhorias||""]})],
    [32,34,36,16,36,50,18,14,15,15,13,24,60]);
  const ac=[["Responsável","Área","Ação","Status"]];
  DIRS.forEach(d=>((S.dirs[d.id]||{}).acoes||[]).forEach(a=>ac.push([d.name,d.area,a.text,a.done?"Concluída":"Em andamento"])));
  MGRS.forEach(m=>((S.mgrs[m.id]||{}).acoes||[]).forEach(a=>ac.push([m.name,m.area,a.text,a.done?"Concluída":"Em andamento"])));
  if(ac.length===1) ac.push(["","","Nenhuma ação registrada",""]);
  add("Ações",ac,[34,52,70,15]);
  // formato percentual
  ["Battle card dti","Diretorias"].forEach(n=>{const ws=wb.Sheets[n];Object.keys(ws).forEach(k=>{const c=ws[k];if(c&&c.t==="n"&&c.v>0&&c.v<1)c.z="0.0%"})});
  return XL.write(wb,{bookType:"xlsx",type:"array"});
}
const expBtn=document.getElementById("exportBtn");
expBtn.addEventListener("click",async()=>{
  if(!window.XLSX){toast("Não foi possível gerar a planilha. Recarregue a página e tente de novo.");return}
  expBtn.disabled=true;
  try{
    const buf=buildWorkbook();
    const d=new Date();const stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    const a=document.createElement("a");a.href=url;a.download=`Conta Vale - monitor dti - ${stamp}.xlsx`;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast("Planilha exportada");
  }catch(e){toast("Não foi possível exportar a planilha")}
  finally{expBtn.disabled=false}
});

/* ---------- Conexão com o Supabase ---------- */
let dbChecked=false;
const authBtn=document.getElementById("authBtn"), dlg=document.getElementById("loginDlg");
const $=id=>document.getElementById(id);
let loginMode="login"; // login | forgot | reset
function setMode(m){
  loginMode=m; $("loginMsg").textContent=""; $("loginPass").value="";
  $("fEmail").hidden = m==="reset";
  $("fPass").hidden  = m==="forgot";
  $("loginForgot").hidden = m!=="login";
  $("loginCancel").hidden = m==="reset";
  $("loginTitle").innerHTML = m==="login" ? "Entrar para <b>editar</b>" : m==="forgot" ? "Recuperar <b>senha</b>" : "Nova <b>senha</b>";
  $("loginHint").textContent = m==="login" ? "Use o e-mail e a senha cadastrados para você."
    : m==="forgot" ? "Informe seu e-mail. Você vai receber um link para criar uma nova senha."
    : "Defina sua nova senha, com pelo menos 8 caracteres.";
  $("loginPassLabel").textContent = m==="reset" ? "Nova senha" : "Senha";
  $("loginPass").autocomplete = m==="reset" ? "new-password" : "current-password";
  $("loginSend").textContent = m==="login" ? "Entrar" : m==="forgot" ? "Enviar link" : "Salvar senha";
}
function openLogin(mode="login"){setMode(mode);if(!dlg.open)dlg.showModal();(mode==="reset"?$("loginPass"):$("loginEmail")).focus()}
$("loginCancel").addEventListener("click",()=>dlg.close());
$("loginForgot").addEventListener("click",()=>openLogin("forgot"));
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault(); if(!sb) return;
  const email=$("loginEmail").value.trim().toLowerCase(), pass=$("loginPass").value, msg=$("loginMsg"), btn=$("loginSend");
  if(loginMode!=="reset"&&!email){msg.textContent="Informe o e-mail.";return}
  if(loginMode!=="forgot"&&!pass){msg.textContent="Informe a senha.";return}
  btn.disabled=true; msg.textContent="Aguarde…";
  try{
    if(loginMode==="login"){
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error){
        const m=(error.message||"")+" "+(error.code||"");
        msg.textContent = /not.?confirmed/i.test(m) ? "Este e-mail ainda não foi confirmado no Supabase. Peça para marcarem o usuário como confirmado."
          : /invalid/i.test(m) ? "E-mail ou senha incorretos."
          : /provider|disabled/i.test(m) ? "O login por e-mail e senha está desativado no Supabase."
          : /api key|apikey|jwt|unauthorized/i.test(m) ? "Chave do Supabase inválida. Confira o config.js."
          : /fetch|network/i.test(m) ? "Sem conexão com o Supabase. Confira a URL no config.js."
          : "Não foi possível entrar ("+(error.message||"erro desconhecido")+").";
        console.error("Login:",error);return}
      dlg.close(); toast("Você entrou no modo de edição");
    }else if(loginMode==="forgot"){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      msg.textContent = error ? "Não foi possível enviar agora. Tente de novo em alguns minutos." : "Se o e-mail estiver cadastrado, o link chega em instantes.";
    }else{
      if(pass.length<8){msg.textContent="A senha precisa ter pelo menos 8 caracteres.";return}
      const {error}=await sb.auth.updateUser({password:pass});
      if(error){msg.textContent="Não foi possível salvar a senha. Abra o link do e-mail de novo.";return}
      dlg.close(); history.replaceState(null,"",location.pathname+"#geral"); toast("Senha atualizada");
    }
  }finally{btn.disabled=false}
});
authBtn.addEventListener("click",async()=>{ if(userEmail){await sb.auth.signOut();toast("Você saiu")} else openLogin("login") });

async function applySession(session){
  userEmail = session?.user?.email?.toLowerCase() || null;
  canWrite = false;
  if(userEmail){
    const {data}=await sb.from("editors").select("email").eq("email",userEmail).maybeSingle();
    canWrite = !!data;
  }
  authBtn.textContent = userEmail ? "Sair" : "Entrar para editar";
  authBtn.title = userEmail || "";
  render();
}
function applyRow(r){
  if(r.collection==="account"){ if(r.id==="dti") S.dti={...(r.data||{})}; return }
  if(r.collection==="people"){ S.people[r.id]={...(STATIC_PEOPLE[r.id]||{}),...(r.data||{})}; return }
  if(r.collection==="dirs"){ S.dirs[r.id]={...(r.data||{})} }
  if(r.collection==="mgrs"){ S.mgrs[r.id]={...(r.data||{})} }
}
render();
(async()=>{
  try{
    const cfg=window.APP_CONFIG||{};
    if(!window.supabase||!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){dbChecked=true;render();return}
    sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
    const {data,error}=await sb.from("docs").select("collection,id,data");
    if(error) throw error;
    (data||[]).forEach(applyRow);
    dbChecked=true;
    sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
      if(p.eventType==="DELETE"){const o=p.old||{};if(o.collection==="dirs")delete S.dirs[o.id];if(o.collection==="mgrs")delete S.mgrs[o.id];render();return}
      applyRow(p.new);render();
    }).subscribe();
    const {data:{session}}=await sb.auth.getSession();
    await applySession(session);
    sb.auth.onAuthStateChange((ev,s)=>{applySession(s);if(ev==="PASSWORD_RECOVERY")openLogin("reset")});
  }catch(err){console.error(err);sb=null;dbChecked=true;render()}
})();
</script>
